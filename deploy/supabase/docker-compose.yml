name: tmsi-supabase

services:
  db:
    image: supabase/postgres:15.14.1.168
    container_name: supabase-db
    restart: unless-stopped
    mem_limit: 320m
    command:
      [
        "postgres",
        "-c", "config_file=/etc/postgresql/postgresql.conf",
        "-c", "log_min_messages=fatal",
        "-c", "shared_buffers=64MB",
        "-c", "max_connections=30",
        "-c", "work_mem=4MB"
      ]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      - ./init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - tmsi_db_data:/var/lib/postgresql/data
    networks:
      tmsi_net:
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    image: supabase/gotrue:v2.189.0
    container_name: supabase-auth
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}
      # Default (unset) is GoTrue's own "/verify", which only works when
      # GoTrue is reachable at the domain root. Our nginx only proxies
      # /auth/v1/ to it (no Kong stripping this at a different layer), so
      # email links built from the bare default 404 through our own
      # location /. Matches the official supabase/supabase self-hosted
      # .env.example, which sets all four to this for the same reason —
      # our lean stack omitted them and silently inherited the wrong
      # default. Never exercised before this session (E0 only proved the
      # recovery email arrived, not that its link worked).
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${GOTRUE_MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_INVITE: ${GOTRUE_MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${GOTRUE_MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE}
      # Recovery only (E3-i1 scope) — confirmation/invite/email_change keep
      # GoTrue's default {{ .ConfirmationURL }} template, unaffected by this.
      # GoTrue's default recovery template links to its own /auth/v1/verify,
      # which redirects back with a PKCE `code` that only exchanges
      # successfully in the SAME browser that requested the reset (the
      # code_verifier lives in a cookie there). Recovery links are routinely
      # opened somewhere else — the phone's mail app, a different browser —
      # which broke every real attempt. This custom template (served by our
      # own app over the tmsi_net network, fetched by GoTrue at send time)
      # links straight to /auth/confirm with token_hash + type=recovery,
      # verified via verifyOtp — self-contained, no local browser state
      # needed. No hard depends_on tmsi-app here: that would be circular
      # (tmsi-app already depends_on auth); the natural startup order
      # (auth healthy, then tmsi-app) already means tmsi-app is up well
      # before any real recovery request happens.
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${GOTRUE_MAILER_TEMPLATES_RECOVERY}
      # Same reasoning, extended to INVITE now that E3-i3 actually exercises
      # it: a raw POST /invite (no code_challenge) yields an implicit-flow
      # token whose /verify redirect puts tokens in a URL fragment, which a
      # server-side route handler can never see.
      GOTRUE_MAILER_TEMPLATES_INVITE: ${GOTRUE_MAILER_TEMPLATES_INVITE}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: TMSI Equipment Price Listing
      # tarefa 4 (2026-09-05), measured before setting: all three were on
      # GoTrue's own defaults (min_length 6, no required character
      # classes, current-password check off) — confirmed against
      # v2.189.0's real source (internal/conf/configuration.go), not
      # assumed. No literal `$` in the character list on purpose — this
      # value goes through docker compose's own ${...} interpolation,
      # which would otherwise try to expand it.
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789:!@#%^&*()_+-="
      # Closes the "PUT /auth/v1/user has no current-password gate"
      # finding from i9/i10 at the root, in GoTrue itself, not just in
      # this app's one code path — see account/password/actions.ts.
      # Exempts recovery-flow sessions automatically (session.IsRecovery()
      # in GoTrue's own source) and never applies to the admin-reset
      # endpoint (/admin/users/{id} has no such check) — both verified
      # against the pinned version's source, not assumed.
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_CURRENT_PASSWORD: "true"
    ports:
      - "172.20.40.1:9999:9999"
    networks:
      tmsi_net:
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rest:
    image: postgrest/postgrest:v14.12
    container_name: supabase-rest
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    ports:
      - "172.20.40.1:3000:3000"
    networks:
      tmsi_net:
    # No Docker healthcheck: the image ships no shell (no wget/curl to hand-roll one),
    # and `postgrest --ready` requires PGRST_SERVER_HOST=localhost, which would break
    # external reachability via the published port. Verified functionally instead
    # (curl against the published endpoint, B4/B7).

  tmsi-app:
    image: ghcr.io/pdr625/tmsiequipment/tmsi-app@sha256:9122dfa58c40add4da785bb85e9c4595336e0f88c78439b7283cb1fa0d259f18
    container_name: tmsi-app
    restart: unless-stopped
    mem_limit: 192m
    depends_on:
      auth:
        condition: service_healthy
      # rest has no Docker healthcheck (see its own comment above) — a
      # condition: service_healthy here would fail compose validation since
      # there's no healthcheck to evaluate.
      rest:
        condition: service_started
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # E3-i3: GoTrue admin operations (invite, ban) have no RLS/security-
      # definer equivalent — they're GoTrue-level, not Postgres. Runtime
      # env only, never NEXT_PUBLIC_* (never reaches the client bundle).
      # Every server action using it checks tmsi.has_role('admin') via the
      # caller's own session first — see src/lib/auth-guard.ts. New attack
      # surface, documented: whoever compromises this container gets full
      # GoTrue admin + PostgREST access.
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    ports:
      - "172.20.40.1:3001:3000"
    networks:
      tmsi_net:
    healthcheck:
      # 127.0.0.1, not localhost: /etc/hosts maps localhost to both 127.0.0.1
      # and ::1, wget tries ::1 first, and the server only binds the IPv4
      # wildcard (HOSTNAME=0.0.0.0) — "localhost" fails with connection
      # refused even though the server is up. Verified in this container.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  tmsi_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.40.0/24

volumes:
  tmsi_db_data:
