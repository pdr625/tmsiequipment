#
# Runs the Next.js app and joins the network of the self-hosted Supabase stack
# (deploy/supabase, cloned from github.com/supabase/supabase/docker — see DEPLOY.md).
# The reverse proxy (Nginx Proxy Manager / SWAG / Caddy) is expected to already
# exist on the host and to sit on the external network "proxy".

name: tmsi

services:
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: tmsi-app
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      # inside the docker network the app talks to Kong directly, not via the public URL
      SUPABASE_INTERNAL_URL: http://supabase-kong:8000
    networks:
      - proxy
      - supabase_default
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      # SWAG / traefik-style hints; harmless for NPM
      tmsi.role: "frontend"

  # Optional: DuckDNS updater when the host has a dynamic IP (not needed on a fixed-IP VPS)
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: tmsi-duckdns
    restart: unless-stopped
    profiles: ["dynamic-ip"]
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      TZ: Europe/Paris

networks:
  proxy:
    external: true
  supabase_default:
    external: true
