server {
    server_name tmsiequipment.duckdns.org;

    # tarefa 4 (2026-09-05), measured before adding: none of these were
    # set. `always` so they still land on error responses (4xx/5xx), not
    # just 200s. script-src/style-src need 'unsafe-inline' because this
    # app has no CSP-nonce wiring in middleware.ts (Next.js's official
    # nonce pattern requires forcing dynamic rendering + threading a
    # per-request nonce there) — every other directive is strict.
    # connect-src/form-action 'self' cover this app's real behaviour
    # exactly: it never calls an external API or submits a form
    # cross-origin. frame-ancestors 'none' + X-Frame-Options: DENY are
    # deliberately redundant (belt and suspenders, cheap).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    location / {
        proxy_pass http://172.20.40.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # tarefa 4: exact match, not a prefix — GoTrue's real endpoint is only
    # ever exactly /token (grant_type=password|refresh_token as a query
    # string, which nginx forwards regardless of this rewrite). Rate
    # limit scoped to just this path, not the whole /auth/v1/ prefix, so
    # /auth/v1/health, /auth/v1/user, /auth/v1/verify etc. are unaffected
    # — see conf.d/tmsi-rate-limits.conf for why this exists at all and
    # how the rate was chosen.
    location = /auth/v1/token {
        limit_req zone=tmsi_auth burst=5 nodelay;
        proxy_pass http://172.20.40.1:9999/token;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /auth/v1/ {
        proxy_pass http://172.20.40.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /rest/v1/ {
        proxy_pass http://172.20.40.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tmsiequipment.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tmsiequipment.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tmsiequipment.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tmsiequipment.duckdns.org;
    return 404; # managed by Certbot


}
