# TMSI (2026-09-23): timing instrumentation for the fixed-latency-per-page
# diagnosis. Scoped log_format + its own log file (tmsi-timing.log), so the
# other 7 vhosts on this host keep the default access.log untouched.
#
# 2026-09-24: três cabeçalhos, para separar NAVEGAÇÃO de PREFETCH.
#
# Um pedido com `?_rsc=` é um pedido de React Server Component. Pode ser duas
# coisas muito diferentes, e o custo é o mesmo:
#   - NAVEGAÇÃO: o utilizador clicou num <Link>. É trabalho pedido, legítimo.
#   - PREFETCH: o Next.js foi buscá-lo sozinho, sem clique. É trabalho
#     especulativo, e foi isso que a 23/09 gerava 12 renders por visita.
#
# O Next.js distingue-os por cabeçalho e só por cabeçalho — o caminho e a query
# são idênticos:
#   RSC: 1                    em ambos
#   Next-Router-Prefetch: 1   SÓ no prefetch
#   Purpose: prefetch         variante usada por alguns clientes/versões
#
# ⚠️ `prefetch={false}` no <Link> do App Router NÃO desliga o prefetch: desliga
# o automático por viewport, mas o Next.js continua a pré-carregar AO PASSAR O
# RATO. Sem estes campos não há como ver isso no log — e era o que faltava para
# saber se a correcção de 23/09 fez tudo o que se julgava.
log_format tmsi_timing '$time_iso8601 $remote_addr "$request" $status '
                        'rt=$request_time urt=$upstream_response_time '
                        'uct=$upstream_connect_time bytes=$body_bytes_sent '
                        'rsc=$http_rsc pf=$http_next_router_prefetch '
                        'purpose=$http_purpose';
