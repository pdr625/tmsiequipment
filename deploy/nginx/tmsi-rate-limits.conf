# TMSI (tarefa 4, 2026-09-05): brute-force mitigation for /auth/v1/token.
# GoTrue v2.189.0 has no built-in rate limiter for password-grant sign-in
# attempts — every RateLimit* field in its own configuration.go covers
# email/SMS/token-refresh/SSO/OTP/anonymous-users/web3/passkey/oauth-
# register, none covers grant_type=password — confirmed against the
# pinned version's real source, not assumed. fail2ban on this host only
# has an sshd jail (checked: no nginx jail is enabled). This nginx-level
# limit is currently the only layer protecting that endpoint.
#
# 10r/m per source IP, burst=5, nodelay (reject immediately once the
# burst is spent — never queue attacker connections waiting to retry).
# Also covers grant_type=refresh_token (a nginx location can't branch on
# query string without `if`, which limit_req doesn't reliably work
# inside) — headroom checked against this app's real refresh cadence:
# JWT_EXPIRY=3600s, so even several pilot users behind one shared IP
# produce at most a few refreshes/hour, far under this limit. Revisit if
# the pilot grows enough that this ever becomes the binding constraint.
limit_req_zone $binary_remote_addr zone=tmsi_auth:10m rate=10r/m;
