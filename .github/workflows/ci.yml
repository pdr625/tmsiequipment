#
# Builds app/ and pushes the image to GHCR. Never runs on the VPS.
#
# item 22 (docs/DISASTER-DRILL.md achado 3): SUPABASE_URL/SUPABASE_ANON_KEY
# used to be NEXT_PUBLIC_* build-args here (see git history if hunting for
# the old "Verify NEXT_PUBLIC_SUPABASE_ANON_KEY is set" step) — now runtime
# env on the deployed container instead (deploy/supabase/docker-compose.yml),
# validated at server startup by app/src/instrumentation.ts. This workflow
# no longer needs either value at all.

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # type=sha defaults to the "sha-<short>" tag format asked for.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/pdr625/tmsiequipment/tmsi-app
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push tmsi-app
        uses: docker/build-push-action@v7.3.0
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
